syntax = "proto3";

package api.colonio.v1alpha;

import "api/colonio/v1alpha/core.proto";

option go_package = "github.com/llamerada-jp/colonio/api/colonio/v1alpha";

message ConsensusProposal {
  oneof content {
    Activate       activate         = 1;
    Terminate      terminate        = 2;
    Extend         extend           = 3;
    PreCommitSplit pre_commit_split = 4;
    CommitSplit    commit_split     = 5;
    PrepareMerge   prepare_merge    = 6;
    CommitMerge    commit_merge     = 7;
    Import         import           = 8;
    Operation      operation        = 9;
    ReleaseMerge   release_merge    = 10;
  }
}

message Activate {
  colonio.v1alpha.NodeID tail = 1;
}

message Terminate {
}

message Extend {
  colonio.v1alpha.NodeID tail = 1;
}

message PreCommitSplit {
  colonio.v1alpha.NodeID tail = 1;
}

message CommitSplit {
  colonio.v1alpha.NodeID tail = 1;
}

message PrepareMerge {
  colonio.v1alpha.NodeID handler = 1;
}

// ReleaseMerge clears the prepare_merge claim of `handler`. It is applied only
// while the claim is still held by `handler`, so it never clears a newer claim.
message ReleaseMerge {
  colonio.v1alpha.NodeID handler = 1;
}

message CommitMerge {
  colonio.v1alpha.NodeID tail = 1;
}

message Import {
  message Record {
    string key   = 1;
    bytes  value = 2;
  }
  repeated Record records = 1;
}

// SectorSnapshot is the replicated state of a sector after applying the log up
// to the snapshot index. State that each replica keeps for its own role, such
// as pending proposals, is not included.
message SectorSnapshot {
  // All records of the sector. A sector that is not active yet can hold
  // records: a split imports them before it activates the sector.
  repeated Import.Record records = 1;

  // The tail of the range. Unset means that the sector is not active. Ignored
  // when terminated is true.
  colonio.v1alpha.NodeID tail = 2;

  // The holder of the prepare_merge claim. Unset means that there is no claim.
  colonio.v1alpha.NodeID merge_by = 3;

  // A replica that applies a snapshot with terminated set is terminated too.
  // A stopped replica does not create a snapshot, so this is never set.
  bool terminated = 4;
}

// ConsensusSnapshot is stored in the data of a raft snapshot. It wraps the
// state of the sector with the member table of the consensus layer, because
// the conf state of raft carries only the raft IDs of the members.
message ConsensusSnapshot {
  // A serialized SectorSnapshot. The consensus layer does not parse it.
  bytes sector_state = 1;

  // The node ID of each member, keyed by its sector number.
  map<uint64, colonio.v1alpha.NodeID> members = 2;
}

message Operation {
  enum Command {
    // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
    COMMAND_GET    = 0;
    COMMAND_SET    = 1;
    COMMAND_PATCH  = 2;
    COMMAND_DELETE = 3;
  }

  Command command      = 1;
  uint32  operation_id = 2;
  string  key          = 3;
  bytes   value        = 4;
}