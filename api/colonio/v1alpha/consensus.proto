syntax = "proto3";

package api.colonio.v1alpha;

import "api/colonio/v1alpha/core.proto";

option go_package = "github.com/llamerada-jp/colonio/api/colonio/v1alpha";

message ConsensusProposal {
  oneof content {
    Activate       activate         = 1;
    Terminate      terminate        = 2;
    Extend         extend           = 3;
    PreCommitSplit pre_commit_split = 4;
    CommitSplit    commit_split     = 5;
    PrepareMerge   prepare_merge    = 6;
    CommitMerge    commit_merge     = 7;
    Import         import           = 8;
    Operation      operation        = 9;
  }
}

message Activate {
  colonio.v1alpha.NodeID tail = 1;
}

message Terminate {
}

message Extend {
  colonio.v1alpha.NodeID tail = 1;
}

message PreCommitSplit {
  colonio.v1alpha.NodeID tail = 1;
}

message CommitSplit {
  colonio.v1alpha.NodeID tail = 1;
}

message PrepareMerge {
  colonio.v1alpha.NodeID handler = 1;
}

message CommitMerge {
  colonio.v1alpha.NodeID tail = 1;
}

message Import {
  message Record {
    string key   = 1;
    bytes  value = 2;
  }
  repeated Record records = 1;
}

message Operation {
  enum Command {
    // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
    COMMAND_GET    = 0;
    COMMAND_SET    = 1;
    COMMAND_PATCH  = 2;
    COMMAND_DELETE = 3;
  }

  Command command      = 1;
  uint32  operation_id = 2;
  string  key          = 3;
  bytes   value        = 4;
}