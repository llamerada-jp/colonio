syntax = "proto3";

package api.colonio.v1alpha;

import "api/colonio/v1alpha/core.proto";

option go_package = "github.com/llamerada-jp/colonio/api/colonio/v1alpha";

// node-node packet container
// Or use an empty message as a ping to cancel the timeout.
message NodePackets {
  repeated NodePacket packets = 1;
}

message NodePacketHead {
  NodeID dst_node_id = 1;
  NodeID src_node_id = 2;
  uint32 hop_count   = 3;
  uint32 mode        = 4;
}

message NodePacket {
  // Enable head if index is 0.
  NodePacketHead head = 1;
  // ID is common to sequence of packets.
  uint32 id = 2;
  // index decreases by 1 in a sequence of packets.
  uint32 index   = 3;
  bytes  content = 4;
}

//
message PacketContent {
  oneof content {
    Error error = 1;

    Routing routing = 10;

    Messaging         messaging          = 20;
    MessagingResponse messaging_response = 21;

    KvsOperation         kvs_operation          = 30;
    KvsOperationResponse kvs_operation_response = 31;

    ConsensusMessage           consensus_message             = 40;
    SectorManageMember         sector_manage_member          = 41;
    SectorManageMemberResponse sector_manage_member_response = 42;
    SectorActivate             sector_activate               = 43;
    SectorActivateResponse     sector_activate_response      = 44;
    SectorPrepareSplit         sector_prepare_split          = 45;
    SectorPrepareSplitResponse sector_prepare_split_response = 46;

    Spread              spread                = 50;
    SpreadKnock         spread_knock          = 51;
    SpreadKnockResponse spread_knock_response = 52;
    SpreadRelay         spread_relay          = 53;
    SpreadRelayResponse spread_relay_response = 54;
  }
}

message Error {
  uint32 code    = 1;
  string message = 2;
}

// for routing
message RoutingNodeRecord {
  int64      r1d_score    = 1;
  Coordinate r2d_position = 2;
}

message Routing {
  Coordinate r2d_position = 1;
  // Key type of map is string from node-id.
  map<string, RoutingNodeRecord> node_records = 2;
}

// for messaging module
message Messaging {
  string name    = 1;
  bytes  message = 2;
}

message MessagingResponse {
  bytes response = 1;
}

// for kvs and consensus module
message KvsOperation {
  enum Command {
    // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
    COMMAND_GET    = 0;
    COMMAND_SET    = 1;
    COMMAND_PATCH  = 2;
    COMMAND_DELETE = 3;
    // Lease lock operations; the lock owner is implicitly the packet source
    // (no spoofable owner field).
    COMMAND_LOCK_ACQUIRE = 4;
    COMMAND_LOCK_RELEASE = 5;
  }

  Command command = 1;
  string  key     = 2;
  bytes   value   = 3; // SET: the value. PATCH: the patch document.

  // CAS condition for SET / PATCH / DELETE (see consensus.proto Operation).
  uint64 cas_revision = 4;
  bool   cas_absent   = 5;

  // PATCH: name of the node-registered Patcher (see consensus.proto
  // Operation.patcher).
  string patcher = 6;

  // GET: respond with the revision only, omitting the value (HEAD-like;
  // cheap CAS base fetch for large values).
  bool without_value = 7;

  // LOCK_ACQUIRE: requested lease duration (clamped by the host).
  uint64 lock_ttl_ms = 8;

  // LOCK_RELEASE: the expected generation (CAS).
  // SET / PATCH / DELETE: guarded-write token; the owner is implicitly the
  // packet source.
  uint64 lock_generation = 9;
}

message KvsOperationResponse {
  enum Error {
    // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
    ERROR_NONE         = 0;
    ERROR_UNKNOWN      = 1;
    ERROR_PREPARING    = 2;
    ERROR_NOT_FOUND    = 3; // used for GET / PATCH / DELETE
    ERROR_CONFLICT     = 4; // CAS / guarded-write token failed; re-read before retrying
    ERROR_PATCH_FAILED = 5; // patcher missing or it rejected the patch; store untouched
    ERROR_LOCKED       = 6; // held by another owner; wait and retry
  }
  Error error = 1;
  bytes value = 2; // used for GET

  // GET: the record's current revision. SET / PATCH: the newly assigned
  // revision.
  uint64 revision = 3;

  // LOCK_ACQUIRE: the granted fencing token and lease deadline (host clock
  // basis; informational for the client, which self-fences on its own
  // monotonic clock).
  uint64 lock_generation  = 4;
  int64  lock_deadline_ms = 5;
}

message ConsensusMessage {
  bytes  sector_id = 1;
  uint64 sector_no = 2;
  bytes  message   = 3;
}

message SectorManageMember {
  enum Command {
    // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
    COMMAND_CREATE = 0;
    COMMAND_APPEND = 1;
    // Out-of-band notification that the member {sector_id, sector_no} was
    // removed from the raft group. A removed member cannot learn its own
    // removal from the group (the leader stops messaging it once the removal
    // applies), so without this it lingers with stale state until the
    // leaderless force-terminate backstop reaps it. members is unused.
    COMMAND_REMOVE = 2;
  }

  bytes               sector_id = 1;
  uint64              sector_no = 2;
  Command             command   = 3;
  map<uint64, NodeID> members   = 4;
}

message SectorManageMemberResponse {
  bytes  sector_id = 1;
  uint64 sector_no = 2;
}

message SectorActivate          {
  bytes sector_id = 1;
}

message SectorActivateResponse     {
  bool success = 1;
}

message SectorPrepareSplit {
  bytes sector_id = 1;
}

message SectorPrepareSplitResponse {
  bool success = 1;
}

// for spread module
message Spread {
  NodeID     source  = 1;
  Coordinate center  = 2;
  double     r       = 3;
  uint64     uid     = 4;
  string     name    = 5;
  bytes      message = 6;
  uint32     opt     = 7;
}

message SpreadKnock {
  Coordinate center = 1;
  double     r      = 2;
  uint64     uid    = 3;
}

message SpreadKnockResponse {
  bool accept = 1;
}

message SpreadRelay {
  NodeID     source  = 1;
  Coordinate center  = 2;
  double     r       = 3;
  uint64     uid     = 4;
  string     name    = 5;
  bytes      message = 6;
  uint32     opt     = 7;
}

message SpreadRelayResponse {
  bool success = 1;
}
