\* KvsSectorLeftover TLC 設定
\* 実行フェーズは KvsSectorLeftoverMC.tla のコメントを参照

SPECIFICATION Spec

CONSTANT Nodes <- MC_Nodes
CONSTANT InitialMembers <- MC_InitialMembers
CONSTANT MaxChurn <- MC_MaxChurn
CONSTANT EnableRelease <- MC_EnableRelease
CONSTANT PermissiveRelease <- MC_PermissiveRelease
CONSTANT ClipActivationTail <- MC_ClipActivationTail

CHECK_DEADLOCK FALSE

\* ── Safety ──
INVARIANT TypeOK
INVARIANT ValidRange
INVARIANT ActiveFlagConsistent
INVARIANT LockOnExistingSector
\* NoOverlap は一時的に破れうるため INVARIANT ではなく PROPERTY で確認
\* INVARIANT NoOverlap

\* ── Liveness (Phase L3 では KvsSectorLeftoverSafety.cfg を使う) ──
PROPERTY EventuallyAllActive
PROPERTY EventuallyFullCoverage
PROPERTY EventuallyNoOverlap
PROPERTY EventuallyNoLeftover
