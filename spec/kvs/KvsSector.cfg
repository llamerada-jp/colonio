\* KvsSector TLC 設定ファイル
\*
\* このファイルは TLC モデルチェッカーに何を検証するかを指示する。
\*
\* SPECIFICATION: 検証対象の時相論理仕様
\* INVARIANT: 全ての到達可能状態で成立すべき条件（safety）
\* PROPERTY: 時相論理の性質（liveness）

SPECIFICATION Spec

\* 定数の代入: KvsSectorMC モジュールで定義した値を使う
CONSTANT Nodes <- MC_Nodes

\* 全ノードが active になった終端状態は意図的に何も起きない。
\* これを deadlock と誤検出させない。
CHECK_DEADLOCK FALSE

\* ──────────────────────────────────────────────
\* Safety（安全性）: 全状態で成立すべき不変条件
\* ──────────────────────────────────────────────

\* 型の整合性
INVARIANT TypeOK

\* active セクターの区間が重ならない
INVARIANT NoOverlap

\* active セクターの区間が妥当（tail が正しい位置にある）
INVARIANT ValidRange

\* ──────────────────────────────────────────────
\* Liveness（活性）: いつか成立すべき性質
\* ──────────────────────────────────────────────

\* 全ノードが最終的に active になる
PROPERTY AllActive

\* ring 全体がギャップなくカバーされる
PROPERTY FullCoverage
